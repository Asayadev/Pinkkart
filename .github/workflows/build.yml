name: Build Pinkkart Shop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web App to APK
        run: |
          npm install -g cordova
          cordova create myApp com.pinkkart.shop PinkkartShop
          cd myApp

          # 1. Live Vercel URL connect karna
          sed -i 's|<content src="index.html" />|<content src="https://pinkkart-shop.vercel.app" />|g' config.xml

          # 2. Permissions setup
          sed -i '/<\/widget>/i \    <allow-navigation href="https://pinkkart-shop.vercel.app*" \/>' config.xml
          sed -i '/<\/widget>/i \    <allow-navigation href="https://*" \/>' config.xml
          sed -i '/<\/widget>/i \    <access origin="*" \/>' config.xml

          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkkartShop-APK
          path: |
            myApp/platforms/android/app/build/outputs/apk/**/*.apk
