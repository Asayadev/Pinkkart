name: Build Pinkkart Shop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web App to APK
        run: |
          npm install -g cordova
          cordova create myApp com.pinkkart.shop Pinkkart
          cd myApp

          # Plugins
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-navigationbar-color

          # Live Vercel URL
          sed -i 's|<content src="index.html" />|<content src="https://pinkkart-shop.vercel.app" />|g' config.xml

          # Custom Icon
          if [ -f "../icon.png" ]; then
            cp ../icon.png icon.png
            sed -i '/<\/widget>/i \    <icon src="icon.png" \/>' config.xml
          fi

          # Permissions
          sed -i '/<\/widget>/i \    <allow-navigation href="https://pinkkart-shop.vercel.app*" \/>' config.xml
          sed -i '/<\/widget>/i \    <allow-navigation href="https://*" \/>' config.xml
          sed -i '/<\/widget>/i \    <access origin="*" \/>' config.xml

          # Top & Bottom Bars White
          sed -i '/<\/widget>/i \    <preference name="StatusBarOverlaysWebView" value="false" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="StatusBarBackgroundColor" value="#ffffff" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="StatusBarStyle" value="default" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="NavigationBarColor" value="#ffffff" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="NavigationBarLight" value="true" \/>' config.xml

          # Splash Screen Preferences
          sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="0" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="FadeSplashScreen" value="false" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="ShowSplashScreenSpinner" value="false" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="BackgroundColor" value="#ffffff" \/>' config.xml

          cordova platform add android

          # 1. Robot icon drawables ko transparent/blank image se overwrite karna
          find platforms/android/app/src/main/res/ -name "*ic_cdv_splashscreen*" -delete
          find platforms/android/app/src/main/res/ -name "*splash*" -type f -delete || true

          # Transparent 1x1 vector drawable create karna
          mkdir -p platforms/android/app/src/main/res/drawable
          cat << 'EOF' > platforms/android/app/src/main/res/drawable/ic_cdv_splashscreen.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">
          </vector>
          EOF

          # 2. Saare themes files me windowSplashScreenAnimatedIcon ko transparent banana
          find platforms/android/app/src/main/res/ -name "themes*.xml" | while read theme; do
            sed -i 's|.*windowSplashScreenAnimatedIcon.*|<item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_cdv_splashscreen</item>|g' "$theme"
            sed -i 's|.*windowSplashScreenBackground.*|<item name="android:windowSplashScreenBackground">#ffffff</item>|g' "$theme"
            sed -i 's|.*android:windowBackground.*|<item name="android:windowBackground">#ffffff</item>|g' "$theme"
          done

          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkkartShop-APK
          path: |
            myApp/platforms/android/app/build/outputs/apk/**/*.apk
