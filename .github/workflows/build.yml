name: Build Pinkkart Shop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web App to APK
        run: |
          npm install -g cordova
          cordova create myApp com.pinkkart.shop Pinkkart
          cd myApp

          # Plugins
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-navigationbar-color

          # Live Vercel URL
          sed -i 's|<content src="index.html" />|<content src="https://pinkkart-shop.vercel.app" />|g' config.xml

          # Icon copy
          if [ -f "../icon.png" ]; then
            cp ../icon.png icon.png
            sed -i '/<\/widget>/i \    <icon src="icon.png" \/>' config.xml
          fi

          # Permissions
          sed -i '/<\/widget>/i \    <allow-navigation href="https://pinkkart-shop.vercel.app*" \/>' config.xml
          sed -i '/<\/widget>/i \    <allow-navigation href="https://*" \/>' config.xml
          sed -i '/<\/widget>/i \    <access origin="*" \/>' config.xml

          # Top & Bottom Bars White
          sed -i '/<\/widget>/i \    <preference name="StatusBarOverlaysWebView" value="false" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="StatusBarBackgroundColor" value="#ffffff" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="StatusBarStyle" value="default" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="NavigationBarColor" value="#ffffff" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="NavigationBarLight" value="true" \/>' config.xml

          # Cordova preferences for splash
          sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="0" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="FadeSplashScreen" value="false" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="ShowSplashScreenSpinner" value="false" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="BackgroundColor" value="#ffffff" \/>' config.xml

          # Android Platform add karna
          cordova platform add android

          # Robot Icon hatana aur Android 12 Native Splash ko pure white karna
          THEME_FILE="platforms/android/app/src/main/res/values/themes.xml"
          if [ -f "$THEME_FILE" ]; then
            sed -i '/windowSplashScreenAnimatedIcon/d' "$THEME_FILE"
            sed -i '/windowSplashScreenBackground/d' "$THEME_FILE"
            sed -i 's|<style name="Theme.App.SplashScreen" parent="Theme.SplashScreen">|<style name="Theme.App.SplashScreen" parent="Theme.SplashScreen">\n        <item name="windowSplashScreenBackground">#ffffff</item>\n        <item name="windowSplashScreenAnimatedIcon">@null</item>\n        <item name="android:windowBackground">#ffffff</item>|g' "$THEME_FILE"
          fi

          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkkartShop-APK
          path: |
            myApp/platforms/android/app/build/outputs/apk/**/*.apk
